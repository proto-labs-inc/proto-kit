name: Publish Proto release
# main publishes release (and registers it with the app); every other source
# branch publishes preview/<branch>, which preview sites of the same proto
# branch name in their prompts.
on:
  push:
    branches: ['**', '!release', '!preview/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-kit-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'proto-labs-inc/proto-kit' && github.ref != 'refs/heads/release' && !startsWith(github.ref, 'refs/heads/preview/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test release construction and registration
        run: node --test tools/check-plugin.test.mjs tools/update-plugin.test.mjs tools/publish-release.test.mjs tools/register-release.test.mjs tools/variant-manifest.test.mjs tools/publish.test.mjs tools/screen-bundle.test.mjs tools/screen-approval.test.mjs tools/update-rig.test.mjs tools/migrate-rig.test.mjs tools/auto-publish.test.mjs tools/run-repair.test.mjs tools/snapshot-imports.test.mjs
      - name: Test concurrent prototype source windows
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_path"
          PROTO_TEST_CHROME="$chrome_path" node --test tools/cdp/source-session.test.mjs tools/cdp/attach.test.mjs tools/cdp/cdp.test.mjs tools/process-lock.test.mjs tools/port-reservations.test.mjs tools/ports.test.mjs
      - name: Generate version and advance release branch
        id: release
        run: node tools/publish-release.mjs
      # GitHub hosts the kit. Register the verified release with the app so its
      # prompts tell agents which version to check and install.
      - name: Verify published manifest and record release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          PROTO_RELEASE_SHA: ${{ steps.release.outputs.commit }}
          PROTO_APP_URL: ${{ vars.PROTO_APP_URL }}
          PROTO_KIT_RELEASE_TOKEN: ${{ secrets.PROTO_KIT_RELEASE_TOKEN }}
        run: node tools/register-release.mjs
