name: Publish Proto release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-kit-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'proto-labs-inc/proto-kit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test release construction and registration
        run: node --test tools/publish-release.test.mjs tools/register-release.test.mjs tools/variant-manifest.test.mjs tools/publish.test.mjs
      - name: Generate version and advance release branch
        id: release
        run: node tools/publish-release.mjs
      # GITHUB_TOKEN pushes do not trigger another push workflow.
      - name: Verify published manifest and record release
        env:
          GH_TOKEN: ${{ github.token }}
          PROTO_RELEASE_SHA: ${{ steps.release.outputs.commit }}
          PROTO_APP_URL: ${{ vars.PROTO_APP_URL }}
          PROTO_KIT_RELEASE_TOKEN: ${{ secrets.PROTO_KIT_RELEASE_TOKEN }}
        run: node tools/register-release.mjs
