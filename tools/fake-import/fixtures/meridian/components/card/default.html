<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 18px; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; background: #f8fafc; }
  .card { width: 320px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; box-shadow: 0 1px 2px rgb(15 23 42 / 0.04); }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .merchant { font-size: 14px; font-weight: 600; color: #0f172a; }
  .amount { font-size: 16px; font-weight: 650; color: #0f172a; font-variant-numeric: tabular-nums; }
  .meta { margin-top: 3px; font-size: 12px; color: #64748b; }
  .foot { margin-top: 12px; padding-top: 12px; border-top: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
  .badge { font-size: 11.5px; font-weight: 550; padding: 2px 8px; border-radius: 99px; background: #fffbeb; color: #b45309; }
  .who { font-size: 12px; color: #64748b; display: flex; align-items: center; gap: 6px; }
  .avatar { width: 18px; height: 18px; border-radius: 50%; background: #6366f1; color: #fff; font-size: 9px; font-weight: 650; display: inline-flex; align-items: center; justify-content: center; }
</style>
<div class="card">
  <div class="row"><span class="merchant">Figma Inc.</span><span class="amount">$45.00</span></div>
  <div class="meta">Software &amp; SaaS · Sep 16 · Card ··4921</div>
  <div class="foot">
    <span class="badge">Pending review</span>
    <span class="who"><span class="avatar">NK</span>Noor K.</span>
  </div>
</div>
