<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 18px; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; background: #fff; display: flex; align-items: center; gap: 10px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 550; padding: 3px 9px; border-radius: 99px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .approved { background: #ecfdf5; color: #047857; } .approved .dot { background: #10b981; }
  .pending { background: #fffbeb; color: #b45309; } .pending .dot { background: #f59e0b; }
  .flagged { background: #fef2f2; color: #b91c1c; } .flagged .dot { background: #ef4444; }
  .reimbursed { background: #eef2ff; color: #4338ca; } .reimbursed .dot { background: #6366f1; }
</style>
<span class="badge approved"><span class="dot"></span>Approved</span>
<span class="badge pending"><span class="dot"></span>Pending review</span>
<span class="badge flagged"><span class="dot"></span>Flagged</span>
<span class="badge reimbursed"><span class="dot"></span>Reimbursed</span>
