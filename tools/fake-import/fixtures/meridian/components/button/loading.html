<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 18px; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; background: #fff; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 13px; font-weight: 550; border-radius: 8px; padding: 8px 14px; border: 1px solid transparent; cursor: pointer; }
  .primary { background: #4f46e5; color: #fff; }
  .secondary { background: #fff; color: #0f172a; border-color: #cbd5e1; }
  .ghost { background: transparent; color: #475569; }
  .danger { background: #fff; color: #b91c1c; border-color: #fecaca; }
  .sm { font-size: 12px; padding: 5px 10px; border-radius: 6px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; }
  .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<button class="btn primary"><span class="spin"></span>Approving</button>
<button class="btn secondary"><span class="spin"></span>Exporting</button>
