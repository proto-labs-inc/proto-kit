<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 18px; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; background: #fff; display: flex; gap: 16px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 5px; width: 220px; }
  label { font-size: 12px; font-weight: 550; color: #334155; }
  input, select { font: inherit; font-size: 13px; color: #0f172a; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; }
  input:focus, select:focus { outline: 2px solid #c7d2fe; border-color: #4f46e5; }
  .hint { font-size: 11.5px; color: #64748b; }
</style>
<div class="field">
  <label>Merchant</label>
  <input value="Figma Inc." />
  <span class="hint">As it appears on the receipt</span>
</div>
<div class="field">
  <label>Category</label>
  <select><option>Software &amp; SaaS</option><option>Travel</option><option>Meals</option></select>
  <span class="hint">Used for policy checks</span>
</div>
