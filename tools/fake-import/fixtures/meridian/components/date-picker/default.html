<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 18px; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; background: #fff; }
  .picker { width: 244px; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; box-shadow: 0 8px 24px rgb(15 23 42 / 0.08); }
  .head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: #0f172a; padding: 0 4px 8px; }
  .head span:not(.month) { color: #64748b; font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 12px; }
  .dow { color: #64748b; font-size: 11px; padding: 4px 0; }
  .day { padding: 6px 0; border-radius: 6px; color: #0f172a; }
  .day.dim { color: #cbd5e1; }
  .day.today { font-weight: 650; color: #4f46e5; }
  .day.picked { background: #4f46e5; color: #fff; }
</style>
<div class="picker">
  <div class="head"><span>‹</span><span class="month">September 2026</span><span>›</span></div>
  <div class="grid">
    <span class="dow">Mo</span><span class="dow">Tu</span><span class="dow">We</span><span class="dow">Th</span><span class="dow">Fr</span><span class="dow">Sa</span><span class="dow">Su</span>
    <span class="day dim">31</span><span class="day">1</span><span class="day">2</span><span class="day">3</span><span class="day">4</span><span class="day">5</span><span class="day">6</span>
    <span class="day">7</span><span class="day">8</span><span class="day">9</span><span class="day">10</span><span class="day">11</span><span class="day">12</span><span class="day">13</span>
    <span class="day">14</span><span class="day">15</span><span class="day picked">16</span><span class="day">17</span><span class="day">18</span><span class="day">19</span><span class="day">20</span>
    <span class="day">21</span><span class="day">22</span><span class="day">23</span><span class="day today">24</span><span class="day">25</span><span class="day">26</span><span class="day">27</span>
    <span class="day">28</span><span class="day">29</span><span class="day">30</span><span class="day dim">1</span><span class="day dim">2</span><span class="day dim">3</span><span class="day dim">4</span>
  </div>
</div>
